name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: dotnet build PDF2CBZ -c Release --nologo

      - name: Publish win-x64
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet publish PDF2CBZ -c Release -r win-x64 --self-contained -o publish

      - name: Zip publish folder
        if: startsWith(github.ref, 'refs/tags/v')
        run: Compress-Archive -Path publish/* -DestinationPath PDF2CBZ-win-x64.zip

      - name: Attach ZIP to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PDF2CBZ-win-x64.zip
